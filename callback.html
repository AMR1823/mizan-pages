<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mizan – Bank connected</title>
<style>
  body { font-family: system-ui, sans-serif; text-align: center; margin: 60px auto; max-width: 720px; padding: 0 20px; color: #1b1f1d; }
  h1 { color: #0f5c4a; }
  textarea { width: 100%; height: 110px; font-size: 14px; padding: 10px; border-radius: 10px; border: 2px solid #0f5c4a; }
  button, a.btn { display: inline-block; margin: 12px 6px; padding: 12px 22px; border-radius: 24px; border: 0; background: #0f5c4a; color: #fff; font-size: 16px; text-decoration: none; cursor: pointer; }
  .err { color: #b3261e; }
</style>
</head>
<body>
<h1 id="title">Bank approved ✓ / تمت الموافقة</h1>
<p>Copy this text and paste it in the program. / انسخ النص ده والصقه في البرنامج.</p>
<textarea id="url" readonly></textarea>
<div>
  <button id="copy">Copy / نسخ</button>
  <a class="btn" id="open" href="#">Open Mizan app / افتح ميزان</a>
</div>
<p id="status"></p>
<script>
  // Shows the bank authorization result (?code=...&state=...) so it can be pasted,
  // and offers to hand it to the Mizan app via its deep link.
  var full = window.location.href;
  var box = document.getElementById("url");
  box.value = full;
  if (window.location.search.indexOf("error") !== -1) {
    document.getElementById("title").textContent = "Bank refused / البنك رفض";
    document.getElementById("title").className = "err";
  }
  document.getElementById("open").href = "mizan://bank-callback" + window.location.search;
  document.getElementById("copy").onclick = function () {
    box.select();
    navigator.clipboard.writeText(full).then(function () {
      document.getElementById("status").textContent = "Copied ✓ / اتنسخ";
    });
  };
</script>
</body>
</html>
